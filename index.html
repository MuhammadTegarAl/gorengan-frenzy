<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hasan Frenzy</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="game-panel" aria-label="Hasan Frenzy game">
        <div class="hud">
          <div>
            <p class="eyebrow">Snake gorengan</p>
            <h1>Hasan Frenzy</h1>
          </div>
          <div class="stats" aria-label="Game stats">
            <div>
              <span>Skor</span>
              <strong id="score">0</strong>
            </div>
            <div>
              <span>Best</span>
              <strong id="bestScore">0</strong>
            </div>
          </div>
        </div>

        <div class="board-wrap">
          <canvas id="game" width="720" height="720" aria-label="Hasan Frenzy board"></canvas>
          <div id="overlay" class="overlay">
            <div id="gameOverVideoFrame" class="game-over-video hidden" aria-hidden="true">
              <video id="gameOverVideo" muted loop playsinline preload="metadata">
                <source src="./assets/game-over-cry.mp4" type="video/mp4">
              </video>
            </div>
            <h2 id="overlayTitle">Hasan lapar.</h2>
            <p id="overlayText">Tekan Start atau Space buat mulai ngejar gorengan.</p>
            <button id="startButton" class="primary">Start</button>
          </div>
        </div>

        <div class="dpad" aria-label="Directional controls">
          <button class="arrow up" type="button" data-dir="up" aria-label="Naik">↑</button>
          <button class="arrow left" type="button" data-dir="left" aria-label="Kiri">←</button>
          <button class="arrow right" type="button" data-dir="right" aria-label="Kanan">→</button>
          <button class="arrow down" type="button" data-dir="down" aria-label="Turun">↓</button>
        </div>

        <div class="controls">
          <button id="pauseButton" type="button">Pause</button>
          <label class="difficulty">
            <span>Level</span>
            <select id="difficultySelect" aria-label="Pilih level">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
            </select>
          </label>
          <label class="upload">
            <input id="headUpload" type="file" accept="image/*">
            Ganti kepala
          </label>
          <button id="resetButton" type="button">Reset</button>
        </div>

        <section class="leaderboard-panel" aria-label="Leaderboard">
          <div class="leaderboard-head">
            <div>
              <span>Pemain</span>
              <strong id="playerNameDisplay">-</strong>
            </div>
            <div>
              <span>Top 10</span>
              <strong id="leaderboardLevel">Medium</strong>
            </div>
          </div>
          <ol id="leaderboardList" class="leaderboard-list">
            <li>Loading...</li>
          </ol>
          <div class="leaderboard-actions">
            <button id="changePlayerButton" type="button">Ganti nama</button>
            <button id="adminResetButton" type="button">Reset data</button>
          </div>
          <p id="syncStatus" class="sync-status">Supabase belum dikonfigurasi.</p>
        </section>
      </section>

      <div id="playerModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="playerModalTitle">
        <form id="playerForm" class="name-modal">
          <h2 id="playerModalTitle">Masuk dulu.</h2>
          <p>Nama ini dipakai buat nyimpen skor dan leaderboard.</p>
          <label>
            <span>Username</span>
            <input id="playerNameInput" name="username" type="text" maxlength="24" autocomplete="nickname" required>
          </label>
          <label>
            <span>Level awal</span>
            <select id="initialDifficultySelect" name="difficulty">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
            </select>
          </label>
          <button class="primary" type="submit">Gas main</button>
        </form>
      </div>
    </main>
    <script src="./supabase-config.js?v=1"></script>
    <script src="./game.js?v=8"></script>
  </body>
</html>
